<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo-192x192.png">
<meta name="theme-color" content="#00ff66">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SQL CMD v4.1 - Font Only</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<style>
:root{--bg:#0a0a0a;--text:#00ff66;--border:#00ff6633;--card-bg:rgba(20,20,25,0.78)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Consolas','JetBrains Mono',monospace;height:100dvh;display:flex;flex-direction:column;transition:all .2s;overflow:hidden}
header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.6);backdrop-filter:blur(10px);z-index:2}
#title{font-size:13px;opacity:.8}
#settingsBtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(10px)}
#log{flex:1;overflow:auto;padding:14px;font-size:14px;line-height:1.7}
#bar{display:flex;align-items:center;border-top:1px solid var(--border);background:rgba(10,10,10,0.85);backdrop-filter:blur(12px)}
#prompt{padding:12px 0 12px 14px;white-space:nowrap;font-weight:700}
#cmd{flex:1;background:transparent;color:var(--text);border:0;padding:12px;font-size:15px;font-family:inherit;outline:0}
table{border-collapse:collapse;margin:10px 0} td,th{border:1px solid var(--border);padding:6px 12px}
.err{color:#ff4d6d}.inf{color:#5ac8ff}.echo{color:#fff;opacity:.9}

/* GLASS MODAL - FONT ONLY */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;z-index:50;padding:12px}
#overlay.open{display:grid}
#modal{width:min(420px,100%);background:var(--card-bg);border:1px solid rgba(255,255,255,0.12);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);backdrop-filter:blur(24px) saturate(1.4);overflow:hidden;animation:pop .3s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.modal-header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.25)}
.modal-header b{font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.9}
.close-x{width:28px;height:28px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;cursor:pointer}
.content{padding:14px 16px;max-height:72vh;overflow:auto}
.label{font-size:11px;opacity:.55;text-transform:uppercase;letter-spacing:.8px;margin:14px 0 8px}
.label:first-child{margin-top:0}
.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.size-btn{padding:10px 6px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.35);color:#fff;cursor:pointer;text-align:center;font-size:13px;transition:.2s}
.size-btn.active{background:#fff;color:#000;font-weight:700;border-color:#fff;box-shadow:0 4px 14px rgba(255,255,255,0.25)}
.preview-box{background:#000;border-radius:14px;padding:12px;border:1px solid rgba(255,255,255,0.12);font-size:14px;line-height:1.6;min-height:68px}
.font-list{display:flex;flex-direction:column;gap:6px}
.font-item{padding:11px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.35);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;transition:.2s}
.font-item.active{background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.18);color:#fff}
.font-item span.badge{font-size:10px;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,0.1);margin-left:auto}
.btn-row{display:flex;gap:10px;padding:12px 16px;border-top:1px solid rgba(255,255,255,0.08);justify-content:flex-end;background:rgba(0,0,0,0.2)}
.btn{padding:8px 18px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;cursor:pointer;font-size:12px}
.btn.primary{background:#fff;color:#000;font-weight:700}
@media(max-width:600px){#modal{width:100%;border-radius:24px 24px 0 0;align-self:end} #overlay{place-items:end center;padding:0}}
</style>
</head>
<body>
<header>
  <div id="title">SCM SQL APP</div>
  <button id="settingsBtn">⚙️</button>
</header>
<div id="log"></div>
<div id="bar"><span id="prompt">mysql></span><input id="cmd" spellcheck="false" autocomplete="off" placeholder="Enter Your SQL Code Here"></div>

<div id="overlay">
  <div id="modal">
    <div class="modal-header">
      <b>Font Settings</b>
      <button class="close-x" id="closeX">✕</button>
    </div>
    <div class="content">
      <div class="label">Size - Each character is:</div>
      <div class="size-grid" id="sizeGrid"></div>
      
      <div class="label">Selected Font: <span id="selectedFontName" style="opacity:1;color:#fff">Consolas</span></div>
      <div class="preview-box" id="fontPreview">C:\WINDOWS> dir<br>SYSTEM&nbsp;&nbsp;&nbsp;&lt;DIR&gt;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;10-02-24</div>

      <div class="label">Font Family</div>
      <div class="font-list" id="fontList">
        <div class="font-item active" data-font="'Consolas',monospace" data-name="Consolas"><span>Ⓣ</span> Consolas <span class="badge">TrueType</span></div>
        <div class="font-item" data-font="'JetBrains Mono',monospace" data-name="JetBrains Mono"><span>Ⓣ</span> JetBrains Mono <span class="badge">TT</span></div>
        <div class="font-item" data-font="'Courier Prime',monospace" data-name="Courier New"><span>Ⓣ</span> Courier New <span class="badge">Raster</span></div>
        <div class="font-item" data-font="'Cascadia Mono',monospace" data-name="Cascadia Mono"><span>Ⓣ</span> Cascadia Mono</div>
        <div class="font-item" data-font="monospace" data-name="System Mono"><span>Ⓣ</span> System Mono</div>
      </div>

      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,0.3);padding:8px 12px;border-radius:10px">
        <input type="checkbox" id="boldCheck"> <label for="boldCheck" style="font-size:12px;cursor:pointer">Bold fonts</label>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="okBtn">OK</button>
    </div>
  </div>
</div>

<script>
let db, currentDB="mysql", databases=["information_schema","mysql","performance_schema","test"];
const logEl=document.getElementById('log'), inp=document.getElementById('cmd'), promptEl=document.getElementById('prompt');
function out(t,c='ok'){let d=document.createElement('div');d.className=c;d.innerHTML=t;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}

initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}`}).then(SQL=>{
  db=new SQL.Database();
  db.run("CREATE TABLE users(id INT,name TEXT); INSERT INTO users VALUES(1,'Demo');");
  out("Welcome to MySQL monitor. (v4.1 Font Only)","inf");
  out(`Current DB: <b>${currentDB}</b> - HELP; for commands`,"inf");
});

function run(q){
  let raw=q.trim(); if(!raw) return;
  let uq=raw.toUpperCase().replace(/;$/,'').trim();
  if(uq.startsWith("SHOW DATABASES")){out("<table><tr><th>Database</th></tr>"+databases.map(d=>`<tr><td>${d}</td></tr>`).join("")+"</table>");return;}
  if(uq.startsWith("CREATE DATABASE")){let m=raw.match(/CREATE DATABASE\s+(\w+)/i); if(m){if(!databases.includes(m[1])) databases.push(m[1]); out(`Query OK`);} return;}
  if(uq.startsWith("USE ")){let m=raw.match(/USE\s+(\w+)/i); if(m){if(databases.includes(m[1])){currentDB=m[1]; promptEl.textContent=`${currentDB}>`; out(`Database changed`);} else out(`ERROR: Unknown database '${m[1]}'`,"err");} return;}
  if(uq=="CLEAR"||uq=="CLS"){logEl.innerHTML="";return;}
  if(uq=="HELP"){out(`SHOW DATABASES;<br>CREATE DATABASE mydb;<br>USE mydb;<br>SHOW TABLES;<br>SELECT * FROM users;<br>CLEAR;`,"inf");return;}
  if(uq.startsWith("SHOW TABLES")){try{let r=db.exec("SELECT name FROM sqlite_master WHERE type='table'"); out(r.length? "<table><tr><th>Tables_in_"+currentDB+"</th></tr>"+r[0].values.map(v=>`<tr><td>${v[0]}</td></tr>`).join("")+"</table>":"Empty set");}catch(e){out(e.message,"err")} return;}
  try{let res=db.exec(raw); if(res.length==0) out(`Query OK, ${db.getRowsModified()} rows`); else res.forEach(r=>{let h="<table><tr>"+r.columns.map(c=>"<th>"+c+"</th>").join("")+"</tr>"; r.values.forEach(row=>{h+="<tr>"+row.map(v=>"<td>"+v+"</td>").join("")+"</tr>";}); out(h+"</table>");});}catch(err){out("ERROR: "+err.message,"err");}
}
inp.addEventListener('keydown',e=>{if(e.key==="Enter"){out(promptEl.textContent+" "+inp.value,"echo"); run(inp.value); inp.value="";}});

// SETTINGS - FONT ONLY
const overlay=document.getElementById('overlay');
document.getElementById('settingsBtn').onclick=()=>overlay.classList.add('open');
const closeAll=()=>overlay.classList.remove('open');
document.getElementById('closeX').onclick=closeAll;
document.getElementById('cancelBtn').onclick=closeAll;
document.getElementById('okBtn').onclick=closeAll;
overlay.onclick=e=>{if(e.target===overlay) closeAll();};

const sizes=[12,14,16,18,20,24,28,36,72];
const sizeGrid=document.getElementById('sizeGrid'), fontPreview=document.getElementById('fontPreview'), selectedFontName=document.getElementById('selectedFontName');
sizes.forEach(s=>{
  let b=document.createElement('button'); b.className='size-btn'; if(s===14) b.classList.add('active'); b.textContent=s;
  b.onclick=()=>{
    document.querySelectorAll('.size-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    logEl.style.fontSize=s+'px'; document.getElementById('cmd').style.fontSize=s+'px'; fontPreview.style.fontSize=s+'px';
    fontPreview.innerHTML=`C:\\WINDOWS> dir<br>SYSTEM &lt;DIR&gt;<br><span style="opacity:.6;font-size:11px">Each character is:<br>${s>16?11:8} px wide<br>${s} px high</span>`;
  };
  sizeGrid.appendChild(b);
});

document.querySelectorAll('.font-item').forEach(item=>{
  item.onclick=()=>{
    document.querySelectorAll('.font-item').forEach(x=>x.classList.remove('active')); item.classList.add('active');
    let font=item.dataset.font, name=item.dataset.name;
    selectedFontName.textContent=name;
    document.body.style.fontFamily=font;
    logEl.style.fontFamily=font;
    document.getElementById('cmd').style.fontFamily=font;
    fontPreview.style.fontFamily=font;
  };
});

document.getElementById('boldCheck').onchange=e=>{
  let w=e.target.checked?'700':'400';
  logEl.style.fontWeight=w; fontPreview.style.fontWeight=w;
};
document.body.addEventListener('click',()=>inp.focus());
</script>
</body>
</html>
